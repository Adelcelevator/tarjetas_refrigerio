[package]
name = "tarjetas_refrigerio"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = {version = "4.14.1", default-features = false, features = ["cookies","macros"]}
tokio = { version = "1.53.1", features = ["fs"] }

dotenvy = "0.15.7"
futures = "0.3.34"
thiserror = "2.0.20"
mongodb = "3.8.0"

diesel = { version = "2.3.12", features = ["serde_json","chrono", "numeric"] }
diesel-async = { version = "0.9.2", features = ["postgres", "bb8"] }
rust_decimal = {version = "1.42.1", features = ["db-diesel-postgres", "serde-float", "macros"]}

bb8 = "0.9.1"

serde = {version = "1.0.229", features=["derive"]}
serde_json={version="1.0.151"}
chrono = {version = "0.4.45", features=["serde"]}

tracing = "0.1.44"
tracing-subscriber = {version = "0.3.23", features = ["env-filter","fmt","time","chrono"]}
tracing-log = "0.2.0"
tracing-appender = "0.2.5"
log="0.4.33"


jsonwebtoken = {version="11.0.0",features = ["rust_crypto"]}
aes-gcm = "0.11.0"
base64 = "0.23.1"
sha3 = "0.12.0"
urlencoding = "2.1.3"
rand = "0.10.2"

uuid = {version="1.24.1", features=["v4","macro-diagnostics"]}
bcrypt = "0.19.3"
