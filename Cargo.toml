[package]
name = "tarjetas_refrigerio"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "4.11.0"
dotenvy = "0.15.7"
futures = "0.3.31"
mongodb = "3.2.4"
diesel = { version = "2.2.12", features = ["postgres","r2d2","chrono"] }
serde = {version = "1.0.219", features=["derive"]}
serde_json={version="1.0.142"}
chrono = {version = "0.4.41", features=["serde"]}
log4rs = "1.3.0"
jsonwebtoken = "9.3.1"
aes-gcm = "0.10.3"
base64 = "0.22.1"
sha3 = "0.10.8"
urlencoding = "2.1.3"
log="0.4.27"
uuid = {version="1.18.0", features=["v4","macro-diagnostics"]}
bcrypt = "0.17.0"
r2d2 = "0.8.10"
